name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build esp32-s3-touch-amoled-1.8
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py waveshare --name esp32-s3-touch-amoled-1.8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_esp32-s3-touch-amoled-1.8_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
